    <h2 class="font-headline-lg text-headline-lg font-bold text-on-surface mb-space-md w-full text-left">Accept Payment</h2>
    <div class="bg-surface-container-lowest rounded-3xl p-space-xl shadow-sm flex flex-col items-center w-full">
        <span class="font-body-md text-body-md text-on-surface-variant mb-space-md">Scan to Pay</span>
        <div class="w-48 h-48 bg-surface-container rounded-2xl flex items-center justify-center mb-space-md">
            <span class="material-symbols-outlined text-[64px] text-primary">qr_code_2</span>
        </div>
        <button class="w-full bg-primary-container text-white py-3 rounded-xl font-body-sm font-semibold shadow-md active:scale-95 transition-transform flex justify-center items-center gap-2">
            <span class="material-symbols-outlined text-[18px]">share</span>
            Share Payment Link
        </button>
    </div>
</section>
</div></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/95 backdrop-blur-xl shadow-[0_-4px_24px_rgba(0,46,110,0.06)]" data-active-classes="text-primary-container font-semibold"><div class="flex items-center justify-around h-16 px-space-xs"><a aria-current="page" class="flex flex-col items-center justify-center min-w-[56px] h-12 transition-colors group text-primary-container font-semibold" data-path="merchant-dashboard" href="dashboard.html"><span class="material-symbols-outlined text-[22px] transition-transform group-active:scale-90">home</span><span class="font-body-sm text-body-sm text-[11px] mt-0.5 leading-none">Home</span></a><a class="flex flex-col items-center justify-center min-w-[56px] h-12 text-on-surface-variant transition-colors group" data-path="passbook-ledger" href="passbook.html"><span class="material-symbols-outlined text-[22px] transition-transform group-active:scale-90">receipt_long</span><span class="font-body-sm text-body-sm text-[11px] mt-0.5 leading-none">Passbook</span></a><a class="flex flex-col items-center justify-center min-w-[56px] h-12 text-on-surface-variant transition-colors group" data-path="merchant-lending" href="loans.html"><span class="material-symbols-outlined text-[22px] transition-transform group-active:scale-90">credit_score</span><span class="font-body-sm text-body-sm text-[11px] mt-0.5 leading-none">Loans</span></a><a class="flex flex-col items-center justify-center min-w-[56px] h-12 text-on-surface-variant transition-colors group" data-path="business-account" href="#"><span class="material-symbols-outlined text-[22px] transition-transform group-active:scale-90">store</span><span class="font-body-sm text-body-sm text-[11px] mt-0.5 leading-none">Account</span></a></div></nav>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const chatContainer = document.getElementById("chatContainer");
  const chatInput = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");

  const appendUserMessage = (text) => {
    const msgHTML = `
      <div class="flex items-start gap-space-xs justify-end">
        <div class="flex flex-col max-w-[85%] items-end">
          <div class="bg-primary-container p-space-sm rounded-2xl rounded-tr-sm shadow-sm text-white">
            <p class="font-body-md text-body-md">${text}</p>
          </div>
          <span class="font-body-sm text-[10px] text-on-surface-variant mt-1 mr-1">You • Just now</span>
        </div>
      </div>
    `;
    chatContainer.insertAdjacentHTML("beforeend", msgHTML);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  };

  const appendAIMessage = (text) => {
    const msgHTML = `
      <div class="flex items-start gap-space-xs">
        <div class="w-7 h-7 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container flex-shrink-0 mt-0.5 shadow-sm">
          <span class="material-symbols-outlined text-[15px]">auto_awesome</span>
        </div>
        <div class="flex flex-col max-w-[85%]">
          <div class="bg-surface-container-lowest p-space-sm rounded-2xl rounded-tl-sm shadow-sm text-on-surface">
            <p class="font-body-md text-body-md">${text}</p>
          </div>
          <span class="font-body-sm text-[10px] text-on-surface-variant mt-1 ml-1">Copilot • Just now</span>
        </div>
      </div>
    `;
    chatContainer.insertAdjacentHTML("beforeend", msgHTML);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  };

  const showTypingIndicator = () => {
    const id = "typing-" + Date.now();
    const msgHTML = `
      <div id="${id}" class="flex items-start gap-space-xs">
        <div class="w-7 h-7 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container flex-shrink-0 mt-0.5 shadow-sm">
          <span class="material-symbols-outlined text-[15px]">auto_awesome</span>
        </div>
        <div class="flex flex-col max-w-[85%]">
          <div class="bg-surface-container-lowest p-space-sm rounded-2xl rounded-tl-sm shadow-sm text-on-surface flex gap-1 items-center h-10">
            <span class="w-1.5 h-1.5 rounded-full bg-primary-container animate-bounce" style="animation-delay: 0ms"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-primary-container animate-bounce" style="animation-delay: 150ms"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-primary-container animate-bounce" style="animation-delay: 300ms"></span>
          </div>
        </div>
      </div>
    `;
    chatContainer.insertAdjacentHTML("beforeend", msgHTML);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return id;
  };

  const sendMessage = async () => {
    const text = chatInput.value.trim();
    if (!text) return;
    
    appendUserMessage(text);
    chatInput.value = "";
    
    const typingId = showTypingIndicator();
    
    try {
      const response = await fetch("http://127.0.0.1:8000/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: text, demo_mode: true })
      });
      const data = await response.json();
      document.getElementById(typingId).remove();
      appendAIMessage(data.reply);
    } catch (error) {
      console.error(error);
      document.getElementById(typingId).remove();
      appendAIMessage("Oops, connection issue. Please try again later.");
    }
  };

  sendBtn.addEventListener("click", sendMessage);
  chatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  // Restock Button Logic
  const restockBtn = document.getElementById("restockBtn");
  if (restockBtn) {
    restockBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      e.preventDefault();
      document.getElementById('copilotDrawer').classList.remove('translate-y-full');
      chatInput.value = "Show my latest transactions";
      sendMessage();
    });
  }

  // Dismiss Button Logic
  const dismissBtn = document.getElementById("dismissBtn");
  const alertCard = document.getElementById("alertCard");
  if (dismissBtn && alertCard) {
    dismissBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      e.preventDefault();
      alertCard.style.opacity = '0';
      setTimeout(() => {
        alertCard.style.display = 'none';
      }, 300);
    });
  }

  // Settle Now Button Logic
  const settleBtn = document.getElementById("settleBtn");
  if (settleBtn) {
    settleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      e.preventDefault();
      const textSpan = settleBtn.querySelector('.settle-text');
      if (textSpan) textSpan.textContent = "Settled ✓";
      settleBtn.classList.remove('bg-primary-container');
      settleBtn.classList.add('bg-tertiary-container');
      settleBtn.disabled = true;
      settleBtn.classList.add('opacity-90', 'cursor-not-allowed', 'scale-95');
      settleBtn.classList.remove('active:scale-95');
    });
  }


});
</script>
<script src="i18n.js"></script>
</body></html>
