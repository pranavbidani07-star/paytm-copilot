<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paytm Merchant Growth AI Copilot</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paytm: {
                            blue: '#002e6e',
                            cyan: '#00b9f1',
                            light: '#f8f9fa'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for chat area */
        #chat-history::-webkit-scrollbar {
            width: 6px;
        }
        #chat-history::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-history::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
        /* Markdown styles */
        .markdown-body p { margin-bottom: 0.5rem; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.5rem; }
        .markdown-body ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 0.5rem; }
        .markdown-body strong { font-weight: 600; }
        .markdown-body a { color: #00b9f1; text-decoration: underline; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex font-sans">

    <!-- Sidebar (25% Width) -->
    <aside class="w-1/4 bg-paytm-blue text-white flex flex-col shadow-xl z-10 hidden md:flex">
        <div class="p-6 border-b border-white/10">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <span class="text-paytm-cyan">Paytm</span> Copilot
            </h1>
            <p class="text-sm text-blue-200 mt-1">Merchant Growth AI</p>
        </div>
        
        <div class="p-6 flex-1 flex flex-col gap-6 overflow-y-auto">
            <h2 class="text-xs uppercase tracking-wider text-blue-300 font-semibold mb-2">Business Overview</h2>
            
            <!-- Metric Card 1 -->
            <div class="bg-white/10 p-4 rounded-xl border border-white/5">
                <p class="text-sm text-blue-200">Today's QR Collections</p>
                <p class="text-2xl font-bold mt-1">₹14,200</p>
            </div>

            <!-- Metric Card 2 -->
            <div class="bg-white/10 p-4 rounded-xl border border-white/5">
                <p class="text-sm text-blue-200">Working Capital Available</p>
                <p class="text-2xl font-bold mt-1">₹50,000</p>
            </div>

            <!-- Metric Card 3 -->
            <div class="bg-white/10 p-4 rounded-xl border border-white/5">
                <p class="text-sm text-blue-200">Lapsed Regulars</p>
                <p class="text-2xl font-bold mt-1">18</p>
            </div>
        </div>
        
        <div class="p-4 border-t border-white/10 text-xs text-blue-300/60 text-center">
            Merchant ID: M001
        </div>
    </aside>

    <!-- Main Window (75% Width) -->
    <main class="flex-1 flex flex-col h-full bg-paytm-light relative">
        
        <!-- Header -->
        <header class="bg-white shadow-sm p-4 px-6 flex items-center justify-between border-b border-slate-200 z-10">
            <h2 class="text-lg font-semibold text-slate-700 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-paytm-cyan animate-pulse"></span>
                AI Business Partner
            </h2>
        </header>

        <!-- Chat History -->
        <div id="chat-history" class="flex-1 overflow-y-auto p-6 flex flex-col gap-4 pb-32">
            <!-- Initial Greeting -->
            <div class="flex items-start gap-3 w-full">
                <div class="w-8 h-8 rounded-full bg-paytm-blue flex items-center justify-center shrink-0 text-white font-bold text-xs shadow-sm">
                    AI
                </div>
                <div class="max-w-[80%]">
                    <div class="bg-white px-4 py-3 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 text-sm text-slate-700">
                        Namaste! I am your Paytm AI Copilot. How can I assist you with your business today?
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading-indicator" class="hidden absolute bottom-28 left-6 items-center gap-2 text-sm text-slate-500 bg-white/80 backdrop-blur px-3 py-1.5 rounded-full shadow-sm border border-slate-100">
            <svg class="animate-spin h-4 w-4 text-paytm-cyan" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Copilot is thinking...
        </div>

        <!-- Bottom Input Area -->
        <div class="absolute bottom-0 w-full bg-white border-t border-slate-200 p-4 pb-6 shadow-[0_-4px_6px_-1px_rgb(0,0,0,0.05)]">
            <div class="max-w-4xl mx-auto flex flex-col gap-3">
                
                <!-- Quick Prompts -->
                <div class="flex gap-2 overflow-x-auto pb-1 hide-scrollbar">
                    <button onclick="sendQuickPrompt('Check low stock')" class="whitespace-nowrap px-3 py-1.5 rounded-full bg-blue-50 text-paytm-blue hover:bg-paytm-cyan hover:text-white transition-colors text-xs font-medium border border-blue-100">
                        Check low stock
                    </button>
                    <button onclick="sendQuickPrompt('Who hasn\'t visited lately?')" class="whitespace-nowrap px-3 py-1.5 rounded-full bg-blue-50 text-paytm-blue hover:bg-paytm-cyan hover:text-white transition-colors text-xs font-medium border border-blue-100">
                        Who hasn't visited lately?
                    </button>
                    <button onclick="sendQuickPrompt('Draft a discount campaign')" class="whitespace-nowrap px-3 py-1.5 rounded-full bg-blue-50 text-paytm-blue hover:bg-paytm-cyan hover:text-white transition-colors text-xs font-medium border border-blue-100">
                        Draft a discount campaign
                    </button>
                </div>

                <!-- Input Field -->
                <div class="flex gap-2 items-center">
                    <input 
                        type="text" 
                        id="chat-input" 
                        placeholder="Type a message to your AI Copilot..." 
                        class="flex-1 bg-slate-100 border border-slate-200 rounded-full px-5 py-3 focus:outline-none focus:ring-2 focus:ring-paytm-cyan focus:border-transparent text-sm transition-all"
                        onkeydown="if(event.key === 'Enter') sendMessage()"
                    >
                    <button 
                        onclick="sendMessage()"
                        class="bg-paytm-blue hover:bg-paytm-cyan text-white h-11 w-11 rounded-full flex items-center justify-center transition-colors shadow-md shrink-0"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const chatHistory = document.getElementById('chat-history');
        const chatInput = document.getElementById('chat-input');
        const loadingIndicator = document.getElementById('loading-indicator');

        function sendQuickPrompt(text) {
            chatInput.value = text;
            sendMessage();
        }

        function appendUserMessage(text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'flex items-start gap-3 w-full flex-row-reverse';
            
            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center shrink-0 text-slate-600 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <div class="max-w-[80%]">
                    <div class="bg-paytm-blue text-white px-4 py-3 rounded-2xl rounded-tr-none shadow-sm text-sm">
                        ${escapeHTML(text)}
                    </div>
                </div>
            `;
            chatHistory.appendChild(wrapper);
            scrollToBottom();
        }

        function appendAIMessage(markdownText, toolsUsed) {
            const wrapper = document.createElement('div');
            wrapper.className = 'flex items-start gap-3 w-full';
            
            let toolsHtml = '';
            if (toolsUsed && toolsUsed.length > 0) {
                const toolsBadges = toolsUsed.map(tool => 
                    `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium bg-slate-100 text-slate-600 border border-slate-200 uppercase tracking-wider">
                        <svg class="w-3 h-3 mr-1 text-paytm-cyan" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        ${escapeHTML(tool)}
                    </span>`
                ).join('');
                
                toolsHtml = `<div class="mt-2 flex flex-wrap gap-1">${toolsBadges}</div>`;
            }

            // Parse Markdown
            const parsedHtml = marked.parse(markdownText);

            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-paytm-cyan flex items-center justify-center shrink-0 text-white font-bold text-xs shadow-sm">
                    AI
                </div>
                <div class="max-w-[80%]">
                    <div class="bg-white px-4 py-3 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 text-sm text-slate-700 markdown-body">
                        ${parsedHtml}
                    </div>
                    ${toolsHtml}
                </div>
            `;
            chatHistory.appendChild(wrapper);
            scrollToBottom();
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            // 1. Append User Message
            appendUserMessage(text);
            chatInput.value = '';
            
            // 2. Show Loading
            loadingIndicator.style.display = 'flex';
            
            try {
                // 3 & 4. POST Request
                const response = await fetch('http://localhost:8000/api/v1/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        merchant_id: 'M001',
                        query: text
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // 5. Backend JSON response
                const data = await response.json();
                
                // 6 & 7. Render AI Message and Tools
                appendAIMessage(data.reply, data.tools_used);

            } catch (error) {
                console.error("Error communicating with AI Copilot:", error);
                appendAIMessage("⚠️ Sorry, I'm having trouble connecting to the server right now. Please make sure the backend is running at `http://localhost:8000`.", []);
            } finally {
                loadingIndicator.style.display = 'none';
            }
        }

        function scrollToBottom() {
            chatHistory.scrollTo({
                top: chatHistory.scrollHeight,
                behavior: 'smooth'
            });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }
    </script>
</body>
</html>
